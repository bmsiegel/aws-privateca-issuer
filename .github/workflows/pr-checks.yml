name: PR Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json

  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify release configuration
        run: make verify-release

  helm-test:
    runs-on: ubuntu-latest
    env:
      PR_IMAGE_REPOSITORY: aws-privateca-issuer
      PR_IMAGE_TAG: pr
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build image
        run: docker build --build-arg pkg_version="$(git describe --tags)" --tag "$PR_IMAGE_REPOSITORY:$PR_IMAGE_TAG" .
      - name: Create cluster
        run: make manager kind-cluster
      - name: Load image into cluster
        run: make kind-load-image KIND_LOAD_IMAGE="$PR_IMAGE_REPOSITORY:$PR_IMAGE_TAG"
      - name: Test local chart with this pull request's image
        env:
          IMAGE_REPOSITORY: ${{ env.PR_IMAGE_REPOSITORY }}
          IMAGE_TAG: ${{ env.PR_IMAGE_TAG }}
          EXPECTED_IMAGE: ${{ env.PR_IMAGE_REPOSITORY }}:${{ env.PR_IMAGE_TAG }}
        run: e2e/helm_test.sh
