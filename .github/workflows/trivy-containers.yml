name: Trivy Scanner - Container Images

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  trivy-scan:
    name: Scan published container image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Get image tag from Helm chart
        id: image
        run: echo "tag=$(yq '.appVersion' charts/aws-pca-issuer/Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::105154636954:role/GithubActionsScanRole-prod-us-east-1
          aws-region: us-east-1
          role-session-name: TrivyScan-${{ github.run_id }}

      - name: Login to Amazon Public ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public

      - name: Pull container image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: docker pull "public.ecr.aws/k1n1h4h4/cert-manager-aws-privateca-issuer:${IMAGE_TAG}"

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
        with:
          image-ref: 'public.ecr.aws/k1n1h4h4/cert-manager-aws-privateca-issuer:${{ steps.image.outputs.tag }}'
          output: 'results.json'
          format: 'json'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      - name: Summarize results
        id: summary
        run: |
          CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' results.json)
          HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity == "HIGH")] | length' results.json)
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "total=$((CRITICAL + HIGH))" >> "$GITHUB_OUTPUT"

      - name: Send scan results to Slack
        if: steps.summary.outputs.total != '0'
        uses: slackapi/slack-github-action@v3.0.5
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Trivy daily scan: aws-privateca-issuer:${{ steps.image.outputs.tag }} — ${{ steps.summary.outputs.total }} vulnerabilities (${{ steps.summary.outputs.critical }} critical, ${{ steps.summary.outputs.high }} high)",
              "image_tag": "${{ steps.image.outputs.tag }}",
              "total": "${{ steps.summary.outputs.total }}",
              "critical": "${{ steps.summary.outputs.critical }}",
              "high": "${{ steps.summary.outputs.high }}",
              "scan_url": "${{ github.server_url }}/${{ github.repository }}/security/code-scanning",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Convert results to SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
        with:
          image-ref: 'public.ecr.aws/k1n1h4h4/cert-manager-aws-privateca-issuer:${{ steps.image.outputs.tag }}'
          output: 'results.sarif'
          format: 'sarif'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          skip-setup-trivy: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: 'results.sarif'
          category: trivy-published
