name: On Push to Main Branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.describe.outputs.version }}
      beta_role: ${{ vars.BETA_PUBLISH_ROLE || 'arn:aws:iam::783680406432:role/GithubActionsPublishRole-test-us-east-1' }}
      beta_public_repository: ${{ vars.BETA_PUBLIC_REPOSITORY || 'public.ecr.aws/z0d6s8x8/cert-manager-aws-privateca-issuer-test' }}
      beta_private_repository: ${{ vars.BETA_PRIVATE_REPOSITORY || '783680406432.dkr.ecr.us-east-1.amazonaws.com/eks/aws-privateca-issuer-test' }}
      beta_charts_url: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages-beta
      prod_role: ${{ vars.PROD_PUBLISH_ROLE || 'arn:aws:iam::105154636954:role/GithubActionsPublishRole-prod-us-east-1' }}
      prod_public_repository: ${{ vars.PROD_PUBLIC_REPOSITORY || 'public.ecr.aws/k1n1h4h4/cert-manager-aws-privateca-issuer' }}
      prod_private_repository: ${{ vars.PROD_PRIVATE_REPOSITORY || '105154636954.dkr.ecr.us-east-1.amazonaws.com/eks/aws-privateca-issuer' }}
      prod_charts_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Describe commit
      id: describe
      run: echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"

  publish-beta:
    needs: config
    permissions:
      id-token: write
      contents: read
    uses: './.github/workflows/on-release.yml'
    with:
      version: ${{ needs.config.outputs.version }}
      role: ${{ needs.config.outputs.beta_role }}
      public_repository: ${{ needs.config.outputs.beta_public_repository }}
      private_repository: ${{ needs.config.outputs.beta_private_repository }}
      chart_branch: gh-pages-beta
      charts_url: ${{ needs.config.outputs.beta_charts_url }}
    secrets: inherit

  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Compute next release
      id: semantic
      uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
      with:
        semantic_version: 25.0.9
        dry_run: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    needs: [ plan, config, publish-beta ]
    if: ${{ needs.plan.outputs.tag != '' }}
    strategy:
      matrix:
        architecture: [ arm64, x86_64 ]
    permissions:
      id-token: write
      contents: read
    uses: './.github/workflows/on-safe-to-test-label.yml'
    with:
      architecture: ${{ matrix.architecture }}
      image_repository: ${{ needs.config.outputs.beta_public_repository }}
      image_tag: ${{ needs.config.outputs.version }}

  helm-test-beta:
    needs: [ config, publish-beta ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.config.outputs.version }}
      BETA_PUBLIC_REPOSITORY: ${{ needs.config.outputs.beta_public_repository }}
      BETA_CHARTS_URL: ${{ needs.config.outputs.beta_charts_url }}
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Check latest points at this build
      run: |
        test "$(docker buildx imagetools inspect "$BETA_PUBLIC_REPOSITORY:latest" --format '{{json .Manifest.Digest}}')" = \
             "$(docker buildx imagetools inspect "$BETA_PUBLIC_REPOSITORY:$VERSION" --format '{{json .Manifest.Digest}}')"
    - name: Wait for beta chart
      run: hack/wait-for-chart.sh "$BETA_CHARTS_URL" "$VERSION"
    - name: Create cluster
      run: make manager kind-cluster
    - name: Test beta chart at this version
      env:
        HELM_REPO: ${{ env.BETA_CHARTS_URL }}
        HELM_CHART_VERSION: ${{ env.VERSION }}
        EXPECTED_IMAGE: ${{ env.BETA_PUBLIC_REPOSITORY }}:${{ env.VERSION }}
      run: e2e/helm_test.sh
    - name: Test latest beta chart
      env:
        HELM_REPO: ${{ env.BETA_CHARTS_URL }}
        HELM_DEVEL: "true"
        EXPECTED_IMAGE: ${{ env.BETA_PUBLIC_REPOSITORY }}:${{ env.VERSION }}
      run: e2e/helm_test.sh

  release:
    needs: [ plan, e2e, helm-test-beta ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Tag and create GitHub release
      id: semantic
      uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
      with:
        semantic_version: 25.0.9
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Check release matches plan
      env:
        PLANNED: ${{ needs.plan.outputs.tag }}
        RELEASED: ${{ steps.semantic.outputs.new_release_git_tag }}
      run: |
        if [[ "$PLANNED" != "$RELEASED" ]]; then
          echo "::error::released '$RELEASED' but planned '$PLANNED'"
          exit 1
        fi

  publish-prod:
    needs: [ config, release ]
    if: ${{ needs.release.outputs.tag != '' }}
    permissions:
      id-token: write
      contents: read
    uses: './.github/workflows/on-release.yml'
    with:
      version: ${{ needs.release.outputs.tag }}
      role: ${{ needs.config.outputs.prod_role }}
      public_repository: ${{ needs.config.outputs.prod_public_repository }}
      private_repository: ${{ needs.config.outputs.prod_private_repository }}
      chart_branch: gh-pages
      charts_url: ${{ needs.config.outputs.prod_charts_url }}
    secrets: inherit

  e2e-prod:
    needs: [ config, release, publish-prod ]
    strategy:
      matrix:
        architecture: [ arm64, x86_64 ]
    permissions:
      id-token: write
      contents: read
    uses: './.github/workflows/on-safe-to-test-label.yml'
    with:
      architecture: ${{ matrix.architecture }}
      image_repository: ${{ needs.config.outputs.prod_public_repository }}
      image_tag: ${{ needs.release.outputs.tag }}

  helm-test-prod:
    needs: [ config, release, publish-prod ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.tag }}
      PROD_PUBLIC_REPOSITORY: ${{ needs.config.outputs.prod_public_repository }}
      PROD_CHARTS_URL: ${{ needs.config.outputs.prod_charts_url }}
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Wait for prod chart
      run: hack/wait-for-chart.sh "$PROD_CHARTS_URL" "$VERSION"
    - name: Create cluster
      run: make manager kind-cluster
    - name: Test prod chart at this version
      env:
        HELM_REPO: ${{ env.PROD_CHARTS_URL }}
        HELM_CHART_VERSION: ${{ env.VERSION }}
        EXPECTED_IMAGE: ${{ env.PROD_PUBLIC_REPOSITORY }}:${{ env.VERSION }}
      run: e2e/helm_test.sh
    - name: Test latest prod chart
      env:
        HELM_REPO: ${{ env.PROD_CHARTS_URL }}
        EXPECTED_IMAGE: ${{ env.PROD_PUBLIC_REPOSITORY }}:${{ env.VERSION }}
      run: e2e/helm_test.sh
