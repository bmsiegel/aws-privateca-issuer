name: Publish and Test

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      role:
        required: true
        type: string
      public_repository:
        required: true
        type: string
      private_repository:
        required: true
        type: string
      chart_branch:
        required: true
        type: string
      charts_url:
        required: true
        type: string

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
    uses: './.github/workflows/on-release.yml'
    with:
      version: ${{ inputs.version }}
      role: ${{ inputs.role }}
      public_repository: ${{ inputs.public_repository }}
      private_repository: ${{ inputs.private_repository }}
      chart_branch: ${{ inputs.chart_branch }}
      charts_url: ${{ inputs.charts_url }}
    secrets: inherit

  e2e:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        architecture: [ arm64, x86_64 ]
    permissions:
      id-token: write
      contents: read
    uses: './.github/workflows/on-safe-to-test-label.yml'
    with:
      architecture: ${{ matrix.architecture }}
      chart_repository: ${{ inputs.charts_url }}
      chart_version: ${{ inputs.version }}
      image_repository: ${{ inputs.public_repository }}

  check-latest:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      PUBLIC_REPOSITORY: ${{ inputs.public_repository }}
      PRIVATE_REPOSITORY: ${{ inputs.private_repository }}
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup AWS Credentials
      uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: us-east-1
    - name: Login to Public ECR
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
      with:
        registry-type: public
    - name: Login to Private ECR
      uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
    - name: Check latest points at this version
      run: |
        hack/check-latest.sh "$PUBLIC_REPOSITORY" "$VERSION"
        hack/check-latest.sh "$PRIVATE_REPOSITORY" "$VERSION"
