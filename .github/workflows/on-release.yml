name: Release
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      role:
        required: true
        type: string
      public_repository:
        required: true
        type: string
      private_repository:
        required: true
        type: string
      chart_branch:
        required: true
        type: string
      charts_url:
        required: true
        type: string

env:
  ECR_USER_AGENT: aws-privateca-issuer
  EKS_USER_AGENT: aws-privateca-connector-for-kubernetes-eks-addon

jobs:
  build:
    name: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      PUBLIC_REPOSITORY: ${{ inputs.public_repository }}
      PRIVATE_REPOSITORY: ${{ inputs.private_repository }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$VERSION' does not match vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          echo "PRIVATE_REGISTRY=${PRIVATE_REPOSITORY%%/*}" >> "$GITHUB_ENV"
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Dockerx
        uses: docker/setup-buildx-action@v1
      - name: Setup AWS Credentials
        uses: aws-actions/configure-aws-credentials@master
        with:
          role-to-assume: ${{ inputs.role }}
          aws-region: us-east-1
      - name: Login to Public ECR
        uses: docker/login-action@v1
        with:
          registry: public.ecr.aws
        env:
          AWS_REGION: us-east-1
      - name: Build and push container images
        uses: docker/build-push-action@v6
        with:
          build-args: |
            pkg_version=${{ env.VERSION }}
            user_agent=${{ env.ECR_USER_AGENT }}
          context: .
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.PUBLIC_REPOSITORY }}:latest
            ${{ env.PUBLIC_REPOSITORY }}:${{ env.VERSION }}
          push: true
      - name: Login to Staging ECR
        uses: docker/login-action@v1
        with:
          registry: ${{ env.PRIVATE_REGISTRY }}
        env:
          AWS_REGION: us-east-1
      - name: Build and push arm image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            pkg_version=${{ env.VERSION }}
            user_agent=${{ env.EKS_USER_AGENT }}
          context: .
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ env.PRIVATE_REPOSITORY }}:${{ env.VERSION }}-arm64
          push: true
      - name: Build and push amd image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            pkg_version=${{ env.VERSION }}
            user_agent=${{ env.EKS_USER_AGENT }}
          context: .
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.PRIVATE_REPOSITORY }}:${{ env.VERSION }}-amd64
          push: true
      - name: Build and push manifest list
        uses: docker/build-push-action@v6
        with:
          build-args: |
            pkg_version=${{ env.VERSION }}
            user_agent=${{ env.EKS_USER_AGENT }}
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ env.PRIVATE_REPOSITORY }}:latest
            ${{ env.PRIVATE_REPOSITORY }}:${{ env.VERSION }}
          push: true
      - name: Point chart at published image
        run: |
          sed -i "s#^  repository: .*#  repository: ${PUBLIC_REPOSITORY}#" charts/aws-pca-issuer/values.yaml
      - name: Publish Helm chart
        uses: aws-pca-k8s-plugin-ops-admin/helm-gh-pages@12f5926e622ccae035cf5a3bb8d67ae6db7dc4b7
        with:
          token: ${{ secrets.CR_PAT }}
          branch: ${{ inputs.chart_branch }}
          charts_url: ${{ inputs.charts_url }}
          linting: "off"
          app_version: ${{ env.VERSION }}
          chart_version: ${{ env.VERSION }}
