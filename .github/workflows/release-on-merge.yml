name: Release On Merge

on:
  push:
    branches: [ main ]

concurrency:
  group: release-on-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.CR_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release
        run: |
          npm install --no-save \
            semantic-release@24 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14 \
            @semantic-release/exec@6 \
            @semantic-release/git@10 \
            @semantic-release/github@11 \
            conventional-changelog-conventionalcommits@8

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.CR_PAT }}
          GIT_AUTHOR_NAME: aws-pca-issuer-release
          GIT_AUTHOR_EMAIL: aws-pca-issuer-release@users.noreply.github.com
          GIT_COMMITTER_NAME: aws-pca-issuer-release
          GIT_COMMITTER_EMAIL: aws-pca-issuer-release@users.noreply.github.com
        run: npx semantic-release
