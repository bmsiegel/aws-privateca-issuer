name: On Push to Main Branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.describe.outputs.version }}
      beta_role: ${{ steps.accounts.outputs.beta_role }}
      beta_public_repository: ${{ steps.accounts.outputs.beta_public_repository }}
      beta_private_repository: ${{ steps.accounts.outputs.beta_private_repository }}
      beta_charts_url: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages-beta
      prod_role: ${{ steps.accounts.outputs.prod_role }}
      prod_public_repository: ${{ steps.accounts.outputs.prod_public_repository }}
      prod_private_repository: ${{ steps.accounts.outputs.prod_private_repository }}
      prod_charts_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Describe commit
      id: describe
      run: echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"
    - name: Resolve accounts
      id: accounts
      env:
        DEV_ACCOUNT: ${{ vars.DEV_ACCOUNT }}
        DEV_STAGE: ${{ vars.DEV_STAGE }}
        DEV_REGISTRY_ALIAS: ${{ vars.DEV_REGISTRY_ALIAS }}
        OWNER: ${{ github.repository_owner }}
        REPOSITORY: ${{ github.event.repository.name }}
      run: |
        set -o pipefail
        emit() {
          echo "$1_role=arn:aws:iam::$2:role/GithubActionsPublishRole-$3-us-east-1"
          echo "$1_public_repository=public.ecr.aws/$4/${OWNER}-${REPOSITORY}$5"
          echo "$1_private_repository=$2.dkr.ecr.us-east-1.amazonaws.com/eks/${REPOSITORY}$5"
        }
        if [[ -n "$DEV_ACCOUNT" ]]; then
          : "${DEV_STAGE:?DEV_STAGE must be set with DEV_ACCOUNT}" "${DEV_REGISTRY_ALIAS:?DEV_REGISTRY_ALIAS must be set with DEV_ACCOUNT}"
          emit beta "$DEV_ACCOUNT" "$DEV_STAGE" "$DEV_REGISTRY_ALIAS" -dev
          emit prod "$DEV_ACCOUNT" "$DEV_STAGE" "$DEV_REGISTRY_ALIAS" -dev
        else
          emit beta 783680406432 test z0d6s8x8 -test
          emit prod 105154636954 prod k1n1h4h4 ""
        fi | tee -a "$GITHUB_OUTPUT"

  beta:
    needs: config
    permissions:
      id-token: write
      contents: read
    uses: './.github/workflows/publish-and-test.yml'
    with:
      version: ${{ needs.config.outputs.version }}
      role: ${{ needs.config.outputs.beta_role }}
      public_repository: ${{ needs.config.outputs.beta_public_repository }}
      private_repository: ${{ needs.config.outputs.beta_private_repository }}
      chart_branch: gh-pages-beta
      charts_url: ${{ needs.config.outputs.beta_charts_url }}
    secrets: inherit

  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Dry run release to determine the next version
      id: semantic
      uses: aws-pca-k8s-plugin-ops-admin/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
      with:
        semantic_version: 25.0.9
        dry_run: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [ plan, beta ]
    if: ${{ needs.plan.outputs.tag != '' }}
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
    - name: Check out code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Tag and create GitHub release
      id: semantic
      uses: aws-pca-k8s-plugin-ops-admin/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
      with:
        semantic_version: 25.0.9
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Check release matches plan
      env:
        PLANNED: ${{ needs.plan.outputs.tag }}
        RELEASED: ${{ steps.semantic.outputs.new_release_git_tag }}
      run: |
        if [[ "$PLANNED" != "$RELEASED" ]]; then
          echo "::error::released '$RELEASED' but planned '$PLANNED'"
          exit 1
        fi

  prod:
    needs: [ config, release ]
    if: ${{ needs.release.outputs.tag != '' }}
    permissions:
      id-token: write
      contents: read
    uses: './.github/workflows/publish-and-test.yml'
    with:
      version: ${{ needs.release.outputs.tag }}
      role: ${{ needs.config.outputs.prod_role }}
      public_repository: ${{ needs.config.outputs.prod_public_repository }}
      private_repository: ${{ needs.config.outputs.prod_private_repository }}
      chart_branch: gh-pages
      charts_url: ${{ needs.config.outputs.prod_charts_url }}
    secrets: inherit
